[platformio]
default_envs = video7

[env]
platform = espressif32@7.1.3
board = yolo_uno
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:video6]
build_flags = ${env.build_flags} -D ENABLE_DHT20=0
lib_ignore = DHT20

[env:video7]
build_flags = ${env.build_flags} -D ENABLE_DHT20=1
lib_deps = DHT20
