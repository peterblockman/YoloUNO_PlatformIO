[platformio]
default_envs = video12
[env:video12]
platform = espressif32@7.1.3
board = yolo_uno
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LAB_STAGE=12
lib_deps =
    DHT20
    Adafruit NeoPixel
