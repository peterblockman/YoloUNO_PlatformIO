[platformio]
default_envs = video11
[env]
platform = espressif32@7.1.3
board = yolo_uno
framework = arduino
monitor_speed = 115200
lib_compat_mode = strict
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
[env:video9]
build_flags = ${env.build_flags} -D LAB_STAGE=9
lib_ignore = DHT20, Adafruit NeoPixel
build_src_filter = +<*> -<neo_blinky.cpp> -<temp_humi_monitor.cpp>
[env:video10]
build_flags = ${env.build_flags} -D LAB_STAGE=10
lib_ignore = DHT20
lib_deps = Adafruit NeoPixel
build_src_filter = +<*> -<temp_humi_monitor.cpp>
[env:video11]
build_flags = ${env.build_flags} -D LAB_STAGE=11
lib_deps =
    DHT20
    Adafruit NeoPixel
