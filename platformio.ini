[platformio]
default_envs = week5

[env:week5]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../labs/week5/main.cpp>
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_compat_mode = strict
lib_deps =
    DHT20
    PubSubClient
    ArduinoJson
    adafruit/Adafruit NeoPixel@1.15.5
